<!DOCTYPE html>
<html lang="vi">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>VISNAM SUPPORT SYSTEM</title>

<!-- Tailwind CSS -->
<script src="https://cdn.tailwindcss.com"></script>

<!-- Font Awesome -->
<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>

<!-- XLSX -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

<style>

body{
    background:#020617;
    color:white;
    font-family:Arial, sans-serif;
    overflow-x:hidden;
}

/* TUYẾT */

.snowflake{
    position:fixed;
    top:-10vh;
    color:white;
    opacity:.35;
    pointer-events:none;
    animation:fall linear infinite;
    z-index:1;
}

@keyframes fall{

    from{
        transform:translateY(-10vh);
    }

    to{
        transform:translateY(110vh);
    }

}

/* CARD */

.card{
    background:rgba(15,23,42,.85);
    border:1px solid rgba(255,255,255,.05);
    backdrop-filter:blur(12px);
}

/* INPUT */

.input{
    width:100%;
    background:#020617;
    border:1px solid #334155;
    border-radius:18px;
    padding:14px;
    color:white;
    outline:none;
}

.input:focus{
    border-color:#0ea5e9;
    box-shadow:0 0 0 3px rgba(14,165,233,.15);
}

/* TABLE */

tbody tr:hover{
    background:rgba(30,41,59,.5);
}

::-webkit-scrollbar{
    width:6px;
    height:6px;
}

::-webkit-scrollbar-thumb{
    background:#334155;
    border-radius:20px;
}

</style>

</head>

<body>

<!-- TUYẾT -->

<script>

for(let i=0;i<80;i++){

    let snow=document.createElement("div");

    snow.className="snowflake";

    snow.innerHTML="❄";

    snow.style.left=Math.random()*100+"vw";

    snow.style.fontSize=(Math.random()*12+8)+"px";

    snow.style.animationDuration=
    (Math.random()*10+10)+"s";

    snow.style.opacity=Math.random();

    document.body.appendChild(snow);

}

</script>

<!-- HEADER -->

<header class="h-16 bg-slate-950 border-b border-slate-800 sticky top-0 z-50">

<div class="max-w-7xl mx-auto px-5 h-full flex items-center justify-between">

<div class="flex items-center gap-4">

<div class="w-11 h-11 rounded-2xl bg-sky-500/20 flex items-center justify-center">

<i class="fas fa-building text-sky-400 text-xl"></i>

</div>

<div>

<h1 class="font-bold text-lg tracking-wider">
VISNAM SUPPORT SYSTEM
</h1>

<p class="text-xs text-slate-400">
Hệ thống hỗ trợ khách hàng
</p>

</div>

</div>

<button
onclick="exportExcel()"
class="bg-emerald-500 hover:bg-emerald-600 px-5 py-2 rounded-xl font-bold">

<i class="fas fa-file-excel mr-2"></i>
Xuất Excel

</button>

</div>

</header>

<!-- MAIN -->

<main class="max-w-7xl mx-auto p-5 relative z-10">

<!-- THỐNG KÊ -->

<div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-6">

<div class="card rounded-3xl p-5">

<p class="text-slate-400 text-sm">
Tổng hỗ trợ
</p>

<h2 id="tongHoTro"
class="text-3xl font-bold text-sky-400 mt-2">
0
</h2>

</div>

<div class="card rounded-3xl p-5">

<p class="text-slate-400 text-sm">
Hóa đơn
</p>

<h2 id="tongHD"
class="text-3xl font-bold text-pink-400 mt-2">
0
</h2>

</div>

<div class="card rounded-3xl p-5">

<p class="text-slate-400 text-sm">
Chữ ký số
</p>

<h2 id="tongCKS"
class="text-3xl font-bold text-yellow-400 mt-2">
0
</h2>

</div>

<div class="card rounded-3xl p-5">

<p class="text-slate-400 text-sm">
BHXH
</p>

<h2 id="tongBHXH"
class="text-3xl font-bold text-emerald-400 mt-2">
0
</h2>

</div>

</div>

<!-- FORM -->

<div class="card rounded-3xl p-6 mb-6">

<div class="flex justify-between items-center mb-5">

<h2 class="text-2xl font-bold">
Nhập thông tin hỗ trợ
</h2>

<div id="msg"
class="text-emerald-400 font-bold"></div>

</div>

<!-- MST -->

<div class="grid md:grid-cols-2 gap-5">

<div>

<label class="text-sm text-slate-400 block mb-2">
Mã số thuế
</label>

<div class="flex gap-2">

<input
type="text"
id="mst"
placeholder="Nhập MST..."
class="input">

<button
onclick="traCuuMST()"
class="bg-sky-500 hover:bg-sky-600 px-5 rounded-2xl font-bold">

<i class="fas fa-search"></i>

</button>

</div>

</div>

<div>

<label class="text-sm text-slate-400 block mb-2">
Số điện thoại
</label>

<input
type="text"
id="sdt"
placeholder="Nhập số điện thoại..."
class="input">

</div>

</div>

<!-- TÊN CÔNG TY -->

<div class="mt-5">

<label class="text-sm text-slate-400 block mb-2">
Tên doanh nghiệp
</label>

<input
type="text"
id="tencty"
placeholder="Tên doanh nghiệp..."
class="input">

</div>

<!-- THÔNG TIN -->

<div id="thongtin" class="mt-5"></div>

<!-- LOẠI -->

<div class="grid md:grid-cols-2 gap-5 mt-5">

<div>

<label class="text-sm text-slate-400 block mb-2">
Loại hỗ trợ
</label>

<select id="loai" class="input">

<option>HĐ</option>
<option>CKS</option>
<option>BHXH</option>

</select>

</div>

<div>

<label class="text-sm text-slate-400 block mb-2">
Vấn đề hỗ trợ
</label>

<input
type="text"
id="vanDe"
placeholder="Nhập vấn đề..."
class="input">

</div>

</div>

<!-- BUTTON -->

<button
onclick="luuThongTin()"
class="w-full mt-6 bg-gradient-to-r from-sky-500 to-blue-600 py-4 rounded-2xl font-bold text-lg hover:opacity-90">

<i class="fas fa-save mr-2"></i>
LƯU THÔNG TIN

</button>

</div>

<!-- TABLE -->

<div class="card rounded-3xl overflow-hidden">

<div class="p-5 border-b border-slate-800 flex flex-col md:flex-row gap-3 justify-between">

<h2 class="text-xl font-bold">
Dữ liệu khách hàng
</h2>

<input
type="text"
id="search"
onkeyup="timKiem()"
placeholder="Tìm MST hoặc công ty..."
class="input md:w-[320px]">

</div>

<div class="overflow-auto max-h-[650px]">

<table class="w-full text-sm">

<thead class="bg-slate-950 sticky top-0">

<tr>

<th class="p-4 text-left text-sky-400">STT</th>
<th class="p-4 text-left text-sky-400">Ngày</th>
<th class="p-4 text-left text-sky-400">MST</th>
<th class="p-4 text-left text-sky-400">SĐT</th>
<th class="p-4 text-left text-sky-400">Tên DN</th>
<th class="p-4 text-left text-sky-400">Loại</th>
<th class="p-4 text-left text-sky-400">Tên hỗ trợ</th>
<th class="p-4 text-left text-sky-400">Vấn đề</th>
<th class="p-4 text-left text-red-400">Xóa</th>

</tr>

</thead>

<tbody id="tableData"></tbody>

</table>

</div>

</div>

</main>

<script>

/* DATA */

let dsHoTro =
JSON.parse(localStorage.getItem("dsHoTro")) || [];

/* LOAD */

window.onload=function(){

    renderTable();

    capNhatThongKe();

}

/* THÔNG BÁO */

function thongBao(text){

    document.getElementById("msg").innerText=text;

    setTimeout(()=>{

        document.getElementById("msg").innerText="";

    },2000);

}

/* TRA CỨU MST */

async function traCuuMST(){

    let mst =
    document.getElementById("mst").value.trim();

    if(!mst){

        alert("Nhập mã số thuế");

        return;
    }

    try{

        let res =
        await fetch(
        "https://api.vietqr.io/v2/business/" + mst
        );

        let data = await res.json();

        if(data.code=="00"){

            let info=data.data;

            document.getElementById("tencty").value =
            info.name || "";

            let trangThai =
            info.status || "Đang hoạt động";

            let mauTrangThai =
            trangThai.toLowerCase().includes("đang")
            ? "text-emerald-400"
            : "text-red-400";

            document.getElementById("thongtin").innerHTML=`

            <div class="
            p-5
            rounded-3xl
            bg-slate-950
            border
            border-slate-700">

            <div class="grid md:grid-cols-2 gap-4 text-sm">

            <div>

            <span class="text-slate-400">
            MST:
            </span>

            <span class="text-sky-400 font-bold">
            ${mst}
            </span>

            </div>

            <div>

            <span class="text-slate-400">
            Trạng thái:
            </span>

            <span class="${mauTrangThai} font-bold">
            ${trangThai}
            </span>

            </div>

            <div>

            <span class="text-slate-400">
            Chủ sở hữu:
            </span>

            <span>
            ${info.owner || "---"}
            </span>

            </div>

            <div>

            <span class="text-slate-400">
            Địa chỉ:
            </span>

            <span>
            ${info.address || "---"}
            </span>

            </div>

            <div>

            <span class="text-slate-400">
            Tên công ty:
            </span>

            <span class="text-emerald-400 font-bold">
            ${info.name || "---"}
            </span>

            </div>

            </div>

            </div>

            `;

            thongBao("Tra cứu thành công");

        }else{

            alert("Không tìm thấy MST");

        }

    }catch(e){

        alert("API lỗi hoặc bị chặn");

    }

}

/* LƯU */

function luuThongTin(){

    let mst =
    document.getElementById("mst").value.trim();

    let sdt =
    document.getElementById("sdt").value.trim();

    let tencty =
    document.getElementById("tencty").value.trim();

    let loai =
    document.getElementById("loai").value;

    let vanDe =
    document.getElementById("vanDe").value.trim();

    if(mst=="" || tencty==""){

        alert("Nhập MST trước");

        return;
    }

    let now = new Date();

    let ngay =
    now.getDate().toString().padStart(2,'0')
    + "/"
    + (now.getMonth()+1).toString().padStart(2,'0')
    + "/"
    + now.getFullYear()
    + " "
    + now.getHours().toString().padStart(2,'0')
    + ":"
    + now.getMinutes().toString().padStart(2,'0');

    let duLieuMoi={

        ngay:ngay,
        mst:mst,
        sdt:sdt,
        tencty:tencty,
        loai:loai,
        nguoiHoTro:"Dũng",
        vanDe:vanDe

    };

    dsHoTro.unshift(duLieuMoi);

    localStorage.setItem(
    "dsHoTro",
    JSON.stringify(dsHoTro)
    );

    renderTable();

    capNhatThongKe();

    thongBao("Đã lưu thành công");

    document.getElementById("mst").value="";
    document.getElementById("sdt").value="";
    document.getElementById("tencty").value="";
    document.getElementById("vanDe").value="";
    document.getElementById("thongtin").innerHTML="";

}

/* TABLE */

function renderTable(data=dsHoTro){

    let tbody =
    document.getElementById("tableData");

    tbody.innerHTML="";

    data.forEach((item,index)=>{

        tbody.innerHTML += `

        <tr class="border-t border-slate-800">

        <td class="p-4">${index+1}</td>

        <td class="p-4">${item.ngay}</td>

        <td class="p-4 text-sky-400 font-bold">
        ${item.mst}
        </td>

        <td class="p-4">
        ${item.sdt}
        </td>

        <td class="p-4 font-semibold">
        ${item.tencty}
        </td>

        <td class="p-4 text-pink-400">
        ${item.loai}
        </td>

        <td class="p-4 text-yellow-400">
        ${item.nguoiHoTro}
        </td>

        <td class="p-4">
        ${item.vanDe}
        </td>

        <td class="p-4">

        <button
        onclick="xoaDuLieu(${index})"
        class="
        bg-red-500/20
        hover:bg-red-500
        text-red-400
        hover:text-white
        w-10
        h-10
        rounded-xl
        transition">

        <i class="fas fa-trash"></i>

        </button>

        </td>

        </tr>

        `;

    });

}

/* XÓA */

function xoaDuLieu(index){

    let check=
    confirm("Bạn muốn xóa dữ liệu?");

    if(!check) return;

    dsHoTro.splice(index,1);

    localStorage.setItem(
    "dsHoTro",
    JSON.stringify(dsHoTro)
    );

    renderTable();

    capNhatThongKe();

    thongBao("Đã xóa");

}

/* SEARCH */

function timKiem(){

    let value =
    document.getElementById("search")
    .value
    .toLowerCase();

    let loc =
    dsHoTro.filter(item =>

    item.mst.toLowerCase().includes(value)
    ||
    item.tencty.toLowerCase().includes(value)

    );

    renderTable(loc);

}

/* THỐNG KÊ */

function capNhatThongKe(){

    document.getElementById("tongHoTro").innerText =
    dsHoTro.length;

    document.getElementById("tongHD").innerText =
    dsHoTro.filter(x =>
    x.loai.includes("HD")).length;

    document.getElementById("tongCKS").innerText =
    dsHoTro.filter(x =>
    x.loai.includes("CKS")).length;

    document.getElementById("tongBHXH").innerText =
    dsHoTro.filter(x =>
    x.loai.includes("BHXH")).length;

}

/* EXPORT EXCEL */

function exportExcel(){

    if(dsHoTro.length===0){

        alert("Không có dữ liệu");

        return;
    }

    let dataExport =
    dsHoTro.map(item => ({

        "Mã số thuế":item.mst,
        "Số điện thoại":item.sdt,
        "Tên doanh nghiệp":item.tencty,
        "Loại":item.loai,
        "Tên hỗ trợ":item.nguoiHoTro,
        "Vấn đề":item.vanDe

    }));

    let wb =
    XLSX.utils.book_new();

    let ws =
    XLSX.utils.json_to_sheet(dataExport);

    XLSX.utils.book_append_sheet(
    wb,
    ws,
    "HoTroKhachHang"
    );

    XLSX.writeFile(
    wb,
    "du-lieu-ho-tro.xlsx"
    );

    thongBao("Xuất Excel thành công");

}

</script>

</body>
</html>
